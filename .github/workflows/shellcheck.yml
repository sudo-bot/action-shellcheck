name: run shellcheck

permissions:
  contents: read

on: [push]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: run shellcheck
              uses: sudo-bot/action-shellcheck@latest
              with:
                  cli-args: "--format=checkstyle --severity=info docker/tests/script.sh"
            - name: print shellcheck version
              uses: sudo-bot/action-shellcheck@latest
              with:
                  cli-args: "--version"
